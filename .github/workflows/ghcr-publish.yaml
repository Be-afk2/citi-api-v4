name: Docker Image CI For GHCR

on:
  push:
    branches:
      - build
jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare Version Number
        id: version_getter
        run: |
          echo "Setting version to current date and time"
          version=$(date +"%Y%m%d%H%M")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Prepare Image Name
        id: prep
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          echo "image_name=${OWNER}/${REPO}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.prep.outputs.image_name }}:${{ steps.version_getter.outputs.version }}
            ghcr.io/${{ steps.prep.outputs.image_name }}:latest
